<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mars Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'space': '#080D18',
              'panel': '#111C2D',
              'mars': '#E76F32',
              'cyan': '#35C5D5',
              'offwhite': '#F2F4F7',
              'amber': '#FFC857'
            },
            fontFamily: {
              'inter': ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #080D18; overflow: hidden; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(231,111,50,0.3); border-radius: 2px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="app" class="flex flex-row w-screen h-screen overflow-hidden font-inter">

      <div class="w-56 min-w-56 bg-panel border-r border-white/5 flex items-center justify-center">
        <span class="text-offwhite/20 text-xs">Left Panel</span>
      </div>
      <div class="flex-1 bg-space border-r border-white/5 flex items-center justify-center">
        <span class="text-offwhite/20 text-xs">GPS Map</span>
      </div>
      <div id="survival-guide" class="w-80 min-w-72 bg-panel flex flex-col overflow-hidden border-l border-mars/20">
        <div class="flex items-center gap-2 px-5 py-4 bg-space border-b border-white/5 shrink-0">
          <span class="w-2 h-2 rounded-full bg-mars shadow-[0_0_6px_#E76F32] shrink-0"></span>
          <h2 class="text-offwhite text-sm font-semibold flex-1 tracking-wide">Survival Guide</h2>
          <span id="sol-display" class="text-cyan text-xs font-medium tracking-wider">SOL --</span>
        </div>
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4"
             style="scrollbar-width: thin; scrollbar-color: rgba(231,111,50,0.3) transparent;">
          <div id="vitals-section"></div>
          <div class="h-px bg-white/5 shrink-0"></div>
          <div id="cards-section"></div>

        </div>
        <div class="shrink-0 px-4 py-3 border-t border-white/5 bg-space flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 rounded-full bg-cyan animate-pulse"></div>
            <span class="text-cyan text-xs font-medium">Powered by NASA API</span>
          </div>
          <span id="last-updated" class="text-offwhite/25 text-xs">fetching...</span>
        </div>

      </div>

    </div>

    <script src="vitals.js"></script>
    <script src="survivalGuide.js"></script>
  </body>
</html>
