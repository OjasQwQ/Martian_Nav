<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mars Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'space': '#080D18',
              'panel': '#111C2D',
              'mars': '#E76F32',
              'cyan': '#35C5D5',
              'offwhite': '#F2F4F7',
              'amber': '#FFC857'
            },
            fontFamily: {
              'inter': ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="survivalGuide.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #080D18; overflow: hidden; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(231,111,50,0.3); border-radius: 2px; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="app" class="flex flex-row w-screen h-screen overflow-hidden font-inter">

      <div class="w-56 min-w-56 bg-panel border-r border-white/5 flex items-center justify-center">
        <span class="text-offwhite/20 text-xs">Left Panel</span>
      </div>
      <div class="flex-1 bg-space border-r border-white/5 flex items-center justify-center">
        <span class="text-offwhite/20 text-xs">GPS Map</span>
      </div>
      <div id="survival-guide" class="flex flex-col">
        <div class="survival-header">
          <span class="survival-indicator" aria-hidden="true"></span>
          <h2 class="text-offwhite text-sm font-semibold flex-1 tracking-wide">Survival Guide</h2>
          <span id="model-state" class="survival-model-state">MCD 6.2</span>
        </div>
        <div class="survival-scroll">
          <div id="survival-position" class="survival-position" aria-live="polite">
            Select a map location or enter Mars coordinates.
          </div>
          <div id="site-context"></div>
          <div id="vitals-section"></div>
          <div id="atmosphere-section"></div>
          <div class="survival-divider" aria-hidden="true"></div>
          <div id="cards-section"></div>

        </div>
        <div class="survival-footer">
          <div class="survival-footer-status">
            <div class="survival-status-dot" aria-hidden="true"></div>
            <span>MCD climate model · NASA mission references</span>
          </div>
          <span id="model-updated" class="survival-updated">Waiting for selection</span>
        </div>

      </div>

    </div>

    <script src="vitals.js"></script>
    <script src="survivalGuide.js"></script>
  </body>
</html>
